
spring:
  application:
    name: employee-service

  datasource:
    url: jdbc:postgresql://localhost:5433/securitydb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: security

server:
  port: 8080

weather:
  api:
    base-url: https://api.openweathermap.org
    key: ${WEATHER_API_KEY:}