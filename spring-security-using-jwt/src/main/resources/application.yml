
spring:
  application:
    name: spring-security-using-jwt

  datasource:
    url: jdbc:postgresql://localhost:5433/securitydb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: security

server:
  port: 8080

weather:
  api:
    base-url: https://api.openweathermap.org
    key: ${WEATHER_API_KEY:11d57ae2c75bcdfda7ff3c3e7e2a6ea1}
jwt:
  expiration: ${EXPIRATION_TIME:300000}
  secret: ${JWT_SECRET:my-super-secret-key-that-is-long-enough-123456789!@#}

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG