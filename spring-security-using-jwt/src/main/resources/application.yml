
spring:
  application:
    name: spring-security-using-jwt

  datasource:
    url: jdbc:postgresql://localhost:5433/securitydb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: security

server:
  port: 8080

weather:
  api:
    base-url: https://api.openweathermap.org
    key: ${WEATHER_API_KEY:}
jwt:
  expiration: ${EXPIRATION_TIME:60000}
  secret: ${JWT_SECRET:"my-super-secret-key-that-is-long-enough-123456789!@#"}